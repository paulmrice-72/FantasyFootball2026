events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8081;
        root /usr/share/nginx/html;
        index index.html;

        # Required for Blazor WASM deep-link routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache index.html or the boot manifest
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /_framework/blazor.boot.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Fingerprinted framework assets — immutable (filenames contain content hash)
        location ~* ^/_framework/.+\.(js|wasm|dll|dat)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Other static assets (images, fonts, css)
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}