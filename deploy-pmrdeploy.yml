name: Deploy to PMRDEPLOY

on:
  push:
    branches: [ develop ]
  workflow_dispatch:    # ← add this line


env:
  REGISTRY: ghcr.io
  OWNER: paulmrice-72
  REPO: fantasyfootball2026

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FF.API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: FF.API/Dockerfile
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.REPO }}/ff-api:latest

      - name: Build and push FF.WebBlazor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: FF.WebBlazor/Dockerfile
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.REPO }}/ff-blazor:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to PMRDEPLOY
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PMRDEPLOY_HOST }}
          username: ${{ secrets.PMRDEPLOY_USER }}
          key: ${{ secrets.PMRDEPLOY_SSH_KEY }}
          script: |
            cd ~/fantasycombine
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f