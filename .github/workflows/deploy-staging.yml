name: Deploy Staging (PMRDEPLOY)

on:
  push:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/paulmrice-72/fantasyfootball2026-api
  BLAZOR_IMAGE: ghcr.io/paulmrice-72/fantasyfootball2026-blazor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: FF.API/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:staging

      - name: Build and push Blazor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: FF.WebBlazor/Dockerfile
          push: true
          tags: ${{ env.BLAZOR_IMAGE }}:staging

  deploy:
    runs-on: [self-hosted, pmrdeploy]
    needs: build-and-push

    steps:
      - name: Deploy to PMRDEPLOY
        run: |
          cd ~/fantasycombine
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
